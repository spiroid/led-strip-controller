esphome:
  name: bandeau-salon
  friendly_name: "Bandeau LED Salon"

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: bandeau-salon.shibusen.info

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# Sorties PWM, une par canal couleur, pilotant chacune la Gate d'un MOSFET.
# ESP32-C6-DevKitC-1 : GPIO18/19/20, choisies dans le pool "sans conflit"
# (évite GPIO4/5/8/9/15 strapping, GPIO12/13 USB natif, GPIO16/17 pont
# USB-UART utilisé pour la console/logs).
output:
  - platform: ledc
    pin: GPIO18
    id: output_red
  - platform: ledc
    pin: GPIO19
    id: output_green
  - platform: ledc
    pin: GPIO20
    id: output_blue

light:
  - platform: rgb
    name: "Bandeau LED"
    red: output_red
    green: output_green
    blue: output_blue
